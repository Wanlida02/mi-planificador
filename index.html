<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Mi Planificador</title>
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18191c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planificador">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
<script>
// Pantalla de arranque y red de seguridad: si algo falla, se ve un mensaje con «Recargar» en vez de una pantalla en blanco
(function () {
  var shown = false;
  function show(msg) {
    if (shown) return; shown = true;
    var d = document.getElementById('boot'); if (!d) return;
    d.innerHTML = '<div class="boot-box"><b>No se pudo abrir el planificador</b><p>' + String(msg).replace(/[<>&]/g, '') + '</p><button onclick="location.reload()">Recargar</button></div>';
    d.hidden = false;
  }
  window.__bootFail = show;
  window.addEventListener('error', function (e) { if (!window.__appReady) show(e.message || 'Error al cargar'); });
  window.addEventListener('unhandledrejection', function (e) { if (!window.__appReady) show((e.reason && e.reason.message) || 'Error al cargar'); });
  setTimeout(function () { if (!window.__appReady) show('Está tardando demasiado (¿sin cobertura?).'); }, 12000);
})();
</script>
</head>
<body>
<div id="boot" class="boot"><div class="boot-box"><div class="boot-spin"></div>Cargando…</div></div>
<header class="topbar">
  <div class="nav">
    <button class="btn icon" id="prev" aria-label="Anterior">‹</button>
    <button class="btn" id="today">Hoy</button>
    <button class="btn icon" id="next" aria-label="Siguiente">›</button>
    <h1 id="range-label"></h1>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" data-tab="today" role="tab">Hoy</button>
    <button class="tab active" data-tab="week" role="tab">Semana</button>
    <button class="tab" data-tab="backlog" role="tab">Pendientes <span class="count" id="pending-count"></span></button>
    <button class="tab" data-tab="projects" role="tab">Proyectos</button>
  </nav>
  <div class="actions">
    <button class="btn" id="excel-btn" hidden></button>
    <button class="btn warn" id="conflict-btn" hidden title="Solapes con el trabajo">⚠︎ <span id="conflict-count"></span></button>
    <button class="btn" id="sync-btn" title="Sincronizar con Google"><span class="dot" id="sync-dot"></span><span id="sync-label">Google</span></button>
    <button class="btn icon" id="search-btn" aria-label="Buscar">🔍</button>
    <button class="btn icon" id="settings-btn" aria-label="Ajustes">⚙︎</button>
  </div>
</header>
<div class="notice" id="notice" hidden></div>
<div class="notice movebar" id="movebar" hidden></div>

<main>
  <section id="view-week" class="view active">
    <div class="week-wrap">
      <div class="cal" id="cal">
        <div class="cal-tools">
          <div class="seg-mini" id="view-seg" role="group" aria-label="Vista">
            <button type="button" data-days="1">Día</button><button type="button" data-days="3">3 días</button><button type="button" data-days="7">Semana</button>
          </div>
          <div class="tools-right">
            <div class="seg-mini" role="group" aria-label="Zoom de horas">
              <button type="button" id="zoom-out" aria-label="Reducir horas">−</button><button type="button" id="zoom-in" aria-label="Ampliar horas">+</button>
            </div>
            <button type="button" class="add-btn" id="add-btn" aria-label="Nueva tarea o bloqueo">＋ Nuevo</button>
          </div>
        </div>
        <div class="cal-head" id="cal-head"></div>
        <div class="cal-allday" id="cal-allday"></div>
        <div class="cal-scroll" id="cal-scroll">
          <div class="cal-grid" id="cal-grid"></div>
        </div>
      </div>
      <aside class="side" id="side">
        <div class="side-head">
          <h2>Por programar</h2>
          <button class="btn small" id="side-add">+ Tarea</button>
        </div>
        <p class="hint">Arrastra una tarea al calendario.</p>
        <div id="side-list" class="side-list"></div>
      </aside>
    </div>
    <div class="tray" id="tray">
      <button type="button" class="tray-head" id="tray-head"><span id="tray-title">Por programar</span><span class="tray-hint">mantén pulsada una tarea y arrástrala al calendario</span><span class="chev">▾</span></button>
      <div class="tray-list" id="tray-list"></div>
    </div>
    <div class="legend">
      <span><i class="sw trabajo"></i>Trabajo</span>
      <span><i class="sw familia"></i>Luna / familia</span>
      <span><i class="sw personal"></i>Personal</span>
      <span><i class="sw task"></i>Tarea pendiente</span>
      <span><i class="sw done"></i>Tarea hecha</span>
      <span><i class="sw block"></i>Bloqueo de agenda</span>
      <span><i class="sw vac"></i>Vacaciones / día libre</span>
    </div>
  </section>

  <section id="view-today" class="view">
    <div class="today-bar">
      <button class="btn icon" id="today-prev" aria-label="Día anterior">‹</button>
      <button class="btn" id="today-now">Hoy</button>
      <button class="btn icon" id="today-next" aria-label="Día siguiente">›</button>
    </div>
    <div class="agenda" id="agenda"></div>
  </section>

  <section id="view-projects" class="view">
    <div class="proj-bar">
      <div class="seg-mini" id="period-seg" role="group" aria-label="Periodo del informe">
        <button type="button" data-p="week">Semana</button><button type="button" data-p="month">Mes</button><button type="button" data-p="year">Año</button>
      </div>
      <div class="period-nav">
        <button class="btn icon" id="period-prev" aria-label="Periodo anterior">‹</button>
        <span id="period-label"></span>
        <button class="btn icon" id="period-next" aria-label="Periodo siguiente">›</button>
      </div>
      <button type="button" class="add-btn" id="proj-add">＋ Proyecto</button>
    </div>
    <div class="proj-wrap" id="proj-wrap"></div>
  </section>

  <section id="view-backlog" class="view">
    <div class="backlog-bar">
      <form id="quick-add" class="quick-add">
        <input id="quick-title" placeholder="Nueva tarea… (Enter)" autocomplete="off">
        <select id="quick-prio" aria-label="Prioridad"><option value="">Sin clasificar</option><option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option></select>
        <button class="btn primary">Añadir</button>
      </form>
      <div class="filters">
        <select id="filter-cat" aria-label="Categoría"></select>
        <label class="chk"><input type="checkbox" id="filter-scheduled"> Ver programadas</label>
        <label class="chk"><input type="checkbox" id="filter-done"> Ver hechas</label>
        <button class="btn" id="gtasks-btn">Importar de Google Tasks</button>
      </div>
    </div>
    <div class="kanban" id="kanban"></div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>

<script type="module" src="js/main.js"></script>
</body>
</html>
